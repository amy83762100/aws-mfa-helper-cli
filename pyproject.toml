[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-mfa-helper-cli"
dynamic = ["version"]
description = "Interactive CLI that exchanges AWS MFA codes for temporary session credentials."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pei-Yi Lin" }]
keywords = ["aws", "mfa", "sts", "credentials", "cli", "session-token"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "boto3>=1.34",
  "typer>=0.12",
  "questionary>=2.0",
  "rich>=13.0",
  "platformdirs>=4.0",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "moto[sts,iam]>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "boto3-stubs[sts,iam]",
  "pre-commit>=3.7",
]

[project.scripts]
# Single entry point: the short name `aws-mfa` is used by another PyPI package
# (broamski/aws-mfa) and would collide on machines that have both installed.
aws-mfa-helper-cli = "aws_mfa.cli:app"

[project.urls]
Homepage = "https://github.com/amy83762100/aws-mfa-helper-cli"
Issues = "https://github.com/amy83762100/aws-mfa-helper-cli/issues"
Changelog = "https://github.com/amy83762100/aws-mfa-helper-cli/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aws_mfa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_mfa"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Typer requires typer.Option()/Argument() calls in argument defaults.
ignore = ["B008"]

[tool.mypy]
# No python_version pin: each CI job type-checks against its own interpreter.
# (Newer mypy releases reject 3.9 as a target, and the pin broke the
# sys.version_info narrowing for the tomllib/tomli import.)
packages = ["aws_mfa"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
